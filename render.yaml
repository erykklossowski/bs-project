services:
  - type: web
    name: afrr-two-bid-valuation
    runtime: python3
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: PORT
        fromService:
          type: web
          name: afrr-two-bid-valuation
          property: port
    healthCheckPath: /health
    disk:
      name: data
      mountPath: /opt/render/project/src/outputs
      sizeGB: 1