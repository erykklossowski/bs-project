services:
  - type: web
    name: afrr-two-bid-valuation
    runtime: python
    plan: starter
    buildCommand: npm install && pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
    healthCheckPath: /health
    repo: https://github.com/erykklossowski/bs-project
    branch: feature/two-bids-web-app-v1